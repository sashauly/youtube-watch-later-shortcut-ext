<!doctype html>
<html>
  <head>
    <title>YouTube Watch Later Shortcut</title>
    <link rel="stylesheet" href="/popup.css" />
  </head>
  <body>
    <h1>Watch Later Shortcut</h1>
    <p>
      Use keyboard shortcuts to add/remove the current YouTube video or Shorts to your Watch Later
      list.
    </p>
    <ul id="shortcut-list"></ul>
    <button id="open-shortcuts">Change Shortcuts</button>
    <div style="margin-top: 1em">
      <label><input type="checkbox" id="debug-toggle" /> Debug mode</label>
    </div>
    <p><strong>Status:</strong> Extension is active.</p>
    <script src="/popup.js"></script>
  </body>
</html>
