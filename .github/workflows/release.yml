on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

name: Universal WebExtension Release (Simplified Root)

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # --- CONFIGURATION VARIABLES ---
      # 1. Directory containing the package.json and source code (Set to '.' for root)
      WEBEXTENSION_SRC_DIR: .
      # 2. Node.js version to use for setup
      NODE_VERSION: '20'
      # 3. Base names for the output zip files (without the .zip extension)
      CHROME_ZIP_NAME: ywlhe-chrome
      FIREFOX_ZIP_NAME: ywlhe-firefox
      # --- END CONFIGURATION ---

      # Automatically determined variables
      TAG_VERSION: ${{ github.ref_name }}
      # Full paths to the output files (These are still needed for the 'files' inputs)
      CHROME_ZIP_PATH: ${{ env.WEBEXTENSION_SRC_DIR }}/${{ env.CHROME_ZIP_NAME }}.zip
      FIREFOX_ZIP_PATH: ${{ env.WEBEXTENSION_SRC_DIR }}/${{ env.FIREFOX_ZIP_NAME }}.zip
      CRX_FILE_NAME: ${{ env.CHROME_ZIP_NAME }}-${{ env.TAG_VERSION }}.crx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Setup Node.js and pnpm (The Problem Step)
      # ------------------------------------------------------------------
      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          # This should be fine, as 'node-version' is a common input
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          # FIX: Since WEBEXTENSION_SRC_DIR is '.', the lock file is at the root.
          # We specify the file name directly relative to the default working directory.
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install System Dependencies (Optional)
        run: echo "Skipping system dependencies for this run."

      # ------------------------------------------------------------------
      # Build Steps (No working-directory needed as it's the root)
      # ------------------------------------------------------------------
      - name: Install Node Dependencies
        # This runs in the default working directory (the root, '.')
        run: pnpm install --frozen-lockfile

      - name: Run Build and Pack Scripts
        # This runs in the default working directory (the root, '.')
        run: pnpm run pack

      # ------------------------------------------------------------------
      # Release and Upload Steps (These were mostly fine, just cleaner now)
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_VERSION }}
          name: Release ${{ env.TAG_VERSION }}
          draft: false
          prerelease: false
          files: |
            ${{ env.CHROME_ZIP_PATH }}
            ${{ env.FIREFOX_ZIP_PATH }}

      - name: Create CRX file (Chrome Web Store)
        id: create_crx
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: ${{ env.CHROME_ZIP_PATH }}
          crxFilePath: ${{ env.CRX_FILE_NAME }}
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Upload CRX Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CRX_FILE_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
