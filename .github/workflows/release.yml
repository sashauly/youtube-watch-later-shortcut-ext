on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

name: Hardcoded WebExtension Release

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Setup Node.js and pnpm
      # ------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      # FIX: The path to globally installed npm packages (like pnpm)
      # might not be correctly added to the PATH by default for subsequent steps.
      # We use the built-in corepack feature (if Node >= 16.9) or ensure
      # it's installed via a robust method.
      # We will rely on corepack here, which is standard in Node 20.
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install System Dependencies (Optional)
        run: echo "Skipping system dependencies for this run."

      # ------------------------------------------------------------------
      # Build Steps
      # ------------------------------------------------------------------
      - name: Install Node Dependencies
        # pnpm is now correctly set up via corepack
        run: pnpm install --frozen-lockfile

      - name: Run Build and Pack Scripts
        run: pnpm run pack

      # ------------------------------------------------------------------
      # Release and Upload Steps
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ywlhe-chrome.zip
            ywlhe-firefox.zip

      - name: Create CRX file (Chrome Web Store)
        id: create_crx
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: ywlhe-chrome.zip
          crxFilePath: ywlhe-chrome-${{ github.ref_name }}.crx
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Upload CRX Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ywlhe-chrome-${{ github.ref_name }}.crx
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
