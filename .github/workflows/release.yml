on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

name: Hardcoded WebExtension Release

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # No 'env' block needed, all values are hardcoded below

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Setup Node.js and pnpm (Hardcoded)
      # ------------------------------------------------------------------
      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Hardcoded
          cache: 'pnpm'
          # Path is hardcoded to the root, as that's where the lock file is
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install System Dependencies (Optional)
        run: echo "Skipping system dependencies for this run."

      # ------------------------------------------------------------------
      # Build Steps (No working-directory needed as it's the root)
      # ------------------------------------------------------------------
      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build and Pack Scripts
        run: pnpm run pack

      # ------------------------------------------------------------------
      # Release and Upload Steps (Hardcoded File Paths)
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          # Uses github context for tag and name
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            # Hardcoded file names at the root (since WEBEXTENSION_SRC_DIR was '.')
            ywlhe-chrome.zip
            ywlhe-firefox.zip

      - name: Create CRX file (Chrome Web Store)
        id: create_crx
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          # Input zip file is hardcoded
          zipFilePath: ywlhe-chrome.zip
          # Output CRX file needs the tag, so we must use a minimal expression here
          crxFilePath: ywlhe-chrome-${{ github.ref_name }}.crx
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Upload CRX Asset
        uses: softprops/action-gh-release@v2
        with:
          # We must use the same file name from the previous step
          files: ywlhe-chrome-${{ github.ref_name }}.crx
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
