on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

name: Universal WebExtension Release (Final Template)

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # --- CONFIGURATION VARIABLES ---
      WEBEXTENSION_SRC_DIR: . # Directory containing the package.json and source code
      NODE_VERSION: '20'
      CHROME_ZIP_NAME: ywlhe-chrome
      FIREFOX_ZIP_NAME: ywlhe-firefox
      # --- END CONFIGURATION ---

      # Automatically determined variables
      TAG_VERSION: ${{ github.ref_name }}

      # FIX: Avoid self-referencing env context.
      # Since WEBEXTENSION_SRC_DIR is '.', the path is just the file name.
      # This resolves lines 31, 32, and 33 errors.
      CHROME_ZIP_PATH: ${{ env.CHROME_ZIP_NAME }}.zip
      FIREFOX_ZIP_PATH: ${{ env.FIREFOX_ZIP_NAME }}.zip
      CRX_FILE_NAME: ${{ env.CHROME_ZIP_NAME }}-${{ env.TAG_VERSION }}.crx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Setup Node.js and pnpm (Simplified and Working)
      # ------------------------------------------------------------------
      - name: Setup Node.js with pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          # Path to the lock file, relative to the repository root (WEBEXTENSION_SRC_DIR is '.')
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install System Dependencies (Optional)
        run: echo "Skipping system dependencies for this run."

      # ------------------------------------------------------------------
      # Build Steps (No working-directory needed as it's the root)
      # ------------------------------------------------------------------
      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build and Pack Scripts
        run: pnpm run pack

      # ------------------------------------------------------------------
      # Release and Upload Steps
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_VERSION }}
          name: Release ${{ env.TAG_VERSION }}
          draft: false
          prerelease: false
          # These paths are now simple file names at the root.
          files: |
            ${{ env.CHROME_ZIP_PATH }}
            ${{ env.FIREFOX_ZIP_PATH }}

      - name: Create CRX file (Chrome Web Store)
        id: create_crx
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: ${{ env.CHROME_ZIP_PATH }}
          crxFilePath: ${{ env.CRX_FILE_NAME }}
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Upload CRX Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CRX_FILE_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
