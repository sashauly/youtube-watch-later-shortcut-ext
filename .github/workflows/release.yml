on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

name: Hardcoded WebExtension Release (Final Fix)

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 💥 FIX: Dedicated Pnpm Setup Step 💥
      # This step installs pnpm and makes it available on the PATH.
      # ------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # We don't specify a version here, letting pnpm decide the latest or
          # respecting the 'packageManager' field in package.json if it exists.
          run_install: false # We will run pnpm install in a separate step

      # ------------------------------------------------------------------
      # Node.js Setup (Must be separate for correct caching)
      # ------------------------------------------------------------------
      - name: Setup Node.js with pnpm caching
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Hardcoded
          # This configures caching based on pnpm-lock.yaml
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      # ------------------------------------------------------------------
      # Build Steps
      # ------------------------------------------------------------------
      - name: Install Node Dependencies
        # pnpm is now correctly set up and available here.
        run: pnpm install --frozen-lockfile

      - name: Run Build and Pack Scripts
        run: pnpm run pack

      # ------------------------------------------------------------------
      # Release and Upload Steps
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ywlhe-chrome.zip
            ywlhe-firefox.zip

      - name: Create CRX file (Chrome Web Store)
        id: create_crx
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: ywlhe-chrome.zip
          crxFilePath: ywlhe-chrome-${{ github.ref_name }}.crx
          privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Upload CRX Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ywlhe-chrome-${{ github.ref_name }}.crx
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
